name: Release

on:
  push:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: 'https://registry.npmjs.org'
      - name: upgrade npm for Trusted Publishers support
        run: npm install -g npm@latest
      - name: release
        run: |
          npm ci
          npm run ci:release
